name: Native Codex validation

on:
  push:
    branches: [ci/codex-native-validation]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  SOURCE_SHA: 98e862c6988e4202cc73589814d55f37a9059bf2
  PACKAGING_SHA: 286efc9004b30ce07aab88a524eeeb9f82514881
# Complete each paid run. New commits never cancel an in-flight validation.
concurrency:
  group: native-validation-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  check:
    name: typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2

      # The MANDATORY invariant: the three version files + the newest CHANGELOG heading must agree.
      - name: Version consistency
        run: bash scripts/check-version.sh

      - name: Install (root)
        run: bun install --frozen-lockfile

      # Lint as early as it can actually run: oxlint lives in the ROOT node_modules, so the root
      # install has to come first — but nothing else does. It reads the one `.oxlintrc.json` at the
      # root (which already covers web/src, hence no second run after the web install) with no flags
      # of its own, exactly like the pre-commit hook and `collie build`. Cheap (<1s over the whole
      # tree) and placed before the typechecks and tests so a lint failure doesn't burn minutes on a
      # doomed run. This full-tree run is the authority when a narrower surface disagrees.
      - name: Lint
        run: bun run lint

      - name: Typecheck (root)
        run: bun run typecheck
      - name: Test (bridge)
        run: bun run test

      - name: Install (web)
        run: cd web && bun install --frozen-lockfile
      - name: Typecheck (web)
        run: cd web && bun run typecheck
      # The corpus rule (M56 spec 10). The web suite (the `web-tests` shards) already runs this file.
      # This step gives the rule its own name in the run log, so a negative trace that reads `free`
      # is easy to find.
      - name: Corpus rule (golden traces, the negative set never reads free)
        run: cd web && bunx vitest run src/lib/surface/traces.test.ts
      - name: Corpus table (every dialog fixture is not free)
        run: bun scripts/surface-corpus.ts

  # The web suite (vitest), in three shards. It left `check` on 2026-10-17: 519 s of that job's 644 s
  # on run 39063808818 was this one step. `--shard=N/3` splits by file, so the three runners each
  # take about a third of the 465 files. No `needs`, like every job here, so a failure reports in the
  # same run as a lint failure. It installs only `web/`: the suite imports a few files from `bridge/`
  # and reads fixtures from the checkout, but nothing it needs lives in the root `node_modules`.
  # `fail-fast: false` so one red shard does not cancel the other two and hide a second failure.
  # The cost is three runners for about a third of the wall clock each; nothing repeats, a re-run is
  # the operator's call. The corpus rule stays in `check`, which runs `traces.test.ts` on its own.
  carried:
    name: Verify completed checks from the unchanged components
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
      - name: Bind existing paid results to the narrowly changed source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'CARRY'
          import json,os,subprocess,time
          baseline='6ebb4562c1231055937ce58e70edeeea680cb810'
          run='40211583034'
          allowed={'cli/codex-attribution.ts','cli/codex-native.ts','cli/codex-native.test.ts','CHANGELOG.md'}
          changed=set(subprocess.check_output(['git','diff','--name-only',baseline,os.environ['SOURCE_SHA']],text=True).splitlines())
          assert changed==allowed,changed
          def api(path):
            return json.loads(subprocess.check_output(['gh','api','repos/djbclark/collie/'+path],text=True))
          meta=api('actions/runs/'+run)
          assert meta['head_sha']=='94269cd1ff9f1afec60c82ef183684723aa8e797',meta['head_sha']
          required={'web tests (1/3)','web tests (2/3)','web tests (3/3)','browser (chromium)','browser (swap server)','crew drill','durable example','backend tests on the Bun floor','Darwin native hooks and process tests'}
          deadline=time.monotonic()+2400
          while True:
            rows={j['name']:j for j in api('actions/runs/'+run+'/jobs?per_page=100')['jobs']}
            for name in required:
              if name in rows and rows[name]['status']=='completed':
                assert rows[name]['conclusion']=='success',(name,rows[name]['conclusion'])
            if required.issubset(rows) and all(rows[n]['status']=='completed' for n in required):break
            assert time.monotonic()<deadline,'prior validation still pending'
            print('Waiting for existing checks: '+', '.join(sorted(n for n in required if n not in rows or rows[n]['status']!='completed')),flush=True)
            time.sleep(60)
          report={'run':run,'baseline_source':baseline,'source':os.environ['SOURCE_SHA'],'changed':sorted(changed),'checks':{n:rows[n]['html_url'] for n in sorted(required)}}
          open('carried-validation.json','w').write(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report))
          CARRY
      - uses: actions/upload-artifact@v4
        with:
          name: carried-validation
          path: carried-validation.json
  payload:
    name: Complete local macOS ARM64 payload
    needs: [check, carried]
    runs-on: macos-14
    env:
      PLATFORM: macos-arm64
      BUN_TARGET: bun-darwin-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PACKAGING_SHA }}
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v22
      - name: Build complete CLI and web payload
        run: |
          set -eu
          cat > "$RUNNER_TEMP/native-build.sh" <<'PAYLOAD'
          set -eu
          version="$(bun -e 'console.log(JSON.parse(await Bun.file("package.json").text()).version)')"
          root="native-payload"
          stage="$RUNNER_TEMP/$root"
          mkdir -p "$stage/bin" "$stage/web"


          bash scripts/check-version.sh

          bun install --frozen-lockfile
          (cd web && bun install --frozen-lockfile && bun run build)

          upstream_bun="$(FLAKE_ROOT="$GITHUB_WORKSPACE" bash scripts/upstream-bun.sh)"
          bun run scripts/build-cli.ts \
            --bun "$upstream_bun" \
            --target "$BUN_TARGET" \
            --outfile "$stage/bin/collie"
          chmod 0755 "$stage/bin/collie"

          case "$PLATFORM" in
            macos-*)
              codesign --force --sign - --timestamp=none "$stage/bin/collie"
              codesign -dv "$stage/bin/collie"
              ;;
          esac

          cp -R web/dist "$stage/web/dist"
          cp herdr-plugin.toml package.json .env.example CHANGELOG.md LICENSE README.md "$stage/"
          cp -R docs "$stage/docs"
          mkdir -p "$stage/scripts"
          cp scripts/collie-ctl.sh "$stage/scripts/collie-ctl.sh"
          chmod 0755 "$stage/scripts/collie-ctl.sh"
          PAYLOAD
          nix develop --command bash "$RUNNER_TEMP/native-build.sh"
      - name: Verify runnable payload and seal provenance
        run: |
          python3 - <<'PYVERIFY'
          import hashlib,json,os,pathlib,platform,subprocess,tarfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'native-payload'
          assert platform.machine()=='arm64',platform.machine()
          binary=root/'bin/collie'
          subprocess.run(['bash','scripts/check-payload-links.sh',str(binary)],check=True)
          version=json.loads((root/'package.json').read_text())['version']
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert sha==os.environ['PACKAGING_SHA']
          functional=os.environ['SOURCE_SHA']
          changed=set(subprocess.check_output(['git','diff','--name-only',functional,sha],text=True).splitlines())
          assert changed=={'package.json','web/package.json','herdr-plugin.toml','CHANGELOG.md'},changed
          reported=subprocess.check_output([str(binary),'version'],text=True).strip()
          assert reported.startswith(version),(reported,version)
          docs=subprocess.check_output([str(binary),'docs','crew'],text=True)
          assert docs.splitlines()[0]=='# Crew commands'
          (root/'.collie-build').write_text(json.dumps({'version':version,'commit':sha})+'\n')
          manifest={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()}
          (root/'local-provenance.json').write_text(json.dumps({'version':version,'commit':sha,'functional_commit':functional,'run_id':os.environ['GITHUB_RUN_ID'],'carried_validation_run':'40211583034','files':manifest},indent=2)+'\n')
          archive=root.parent/'collie-local-macos-arm64.tar.gz'
          with tarfile.open(archive,'w:gz') as t:t.add(root,arcname='native-payload')
          digest=hashlib.sha256(archive.read_bytes()).hexdigest()
          (root.parent/'collie-local-macos-arm64.sha256').write_text(digest+'  '+archive.name+'\n')
          print(json.dumps({'version':version,'commit':sha,'binary_version':reported,'sha256':digest}))
          PYVERIFY
      - uses: actions/upload-artifact@v4
        with:
          name: collie-local-macos-arm64
          path: |
            ${{ runner.temp }}/collie-local-macos-arm64.tar.gz
            ${{ runner.temp }}/collie-local-macos-arm64.sha256
          retention-days: 30
